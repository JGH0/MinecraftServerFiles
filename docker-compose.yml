services:
  minecraft:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modded-mc-server
    restart: unless-stopped

    # Minecraft server + Simple Voice Chat + website/BlueMap
    ports:
      - "25565:25565/tcp"   # Minecraft
      - "24454:24454/udp"   # Simple Voice Chat
      - "8081:8080/tcp"     # Website (static site + /map/ BlueMap)
      # Uncomment to publish BlueMap's webserver directly instead of via nginx:
      # - "8100:8100/tcp"

    volumes:
      # Persist world data and server state across restarts.
      # This reuses the EXISTING "mc-data" volume (declared external below),
      # so the world you already have is kept — not a fresh one.
      - mc-data:/data
      # Optional: world-copy zips to serve on the downloads page. This folder
      # does not need to exist on the host — Docker creates it, and mods.zip
      # is served from the image if there are no backups here.
      - ./website/downloads:/usr/share/nginx/backups/downloads:ro

    environment:
      EULA: "true"
      TYPE: "NEOFORGE"
      VERSION: "1.21.1"
      # Allocate enough RAM for mods — adjust as needed
      MEMORY: "6G"
      MOTD: "A Modded Minecraft Server"
      DIFFICULTY: "hard"
      PVP: "true"
      ALLOW_FLIGHT: "true"
      MAX_PLAYERS: "100"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"
      # Leave LEVEL unset — the server generates a fresh world on first start
      # If you want a specific world, set the seed:
      # SEED: "your_seed_number"
      # Enable RCON so in-container scripts can send commands
      ENABLE_RCON: "true"
      # RCON port (25575) is NOT exposed externally
      RCON_PASSWORD: "__RCON_PASSWORD_FROM_FILE__"
      TZ: Europe/Zurich
      # Schedule daily restart at 01:55 (5 min before 2am)
      EXTRA_CRON: "55 1 * * * /scripts/restart.sh >> /data/restart-cron.log 2>&1"
      # Auto-clean old mods from persistent volume on each deploy
      REMOVE_OLD_MODS: "true"
      # Optional: enable rolling backups
      # ENABLE_AUTOPAUSE: "false"
      # OVERRIDE_SERVER_PROPERTIES: "true"
      # --- BlueMap (bundled in mods/) -------------------------------------
      # Config lives in config/bluemap/ and renders world, nether and end.
      # The integrated webserver listens on 8100 *inside* the container and is
      # reached through nginx at http://<host>:8081/map/ — so 8100 is not
      # published. Mojang EULA acceptance + all other BlueMap settings live in
      # config/bluemap/core.conf (accept-download is already set to true).
      # BlueMap renders the overworld/nether/end into /data/bluemap/web.

    healthcheck:
      test: mcstatus localhost:25565 ping || exit 1
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

volumes:
  # Your existing world lives in this volume. It is marked external so Compose
  # attaches to it instead of creating a new "minecraftserverfiles_mc-data".
  # If it ever gets deleted: docker volume create mc-data
  mc-data:
    external: true
