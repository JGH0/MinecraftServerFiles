version: "3.8"

services:
  minecraft:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modded-mc-server
    restart: unless-stopped

    # Minecraft server + Simple Voice Chat
    ports:
      - "25565:25565/tcp"
      - "24454:24454/udp"

    volumes:
      # Persist world data and server state across restarts
      - mc-data:/data

    environment:
      EULA: "true"
      TYPE: "NEOFORGE"
      VERSION: "1.21.1"
      # Allocate enough RAM for mods — adjust as needed
      MEMORY: "6G"
      MOTD: "A Modded Minecraft Server"
      DIFFICULTY: "normal"
      PVP: "true"
      ALLOW_FLIGHT: "true"
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"
      # Leave LEVEL unset — the server generates a fresh world on first start
      # If you want a specific world, set the seed:
      # SEED: "your_seed_number"
      # Enable RCON so the restart-announcer can send warnings + /stop
      ENABLE_RCON: "true"
      # Static password is fine — RCON port (25575) is NOT exposed externally
      RCON_PASSWORD: "__RCON_PASSWORD_FROM_FILE__"
      # Auto-clean old mods/configs from persistent volume on each deploy
      REMOVE_OLD_MODS: "true"
      REMOVE_OLD_CONFIGS: "true"
      # Optional: enable rolling backups
      # ENABLE_AUTOPAUSE: "false"
      # OVERRIDE_SERVER_PROPERTIES: "true"

    healthcheck:
      test: mcstatus localhost:25565 ping || exit 1
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  # ─── Restart Announcer ──────────────────────────────────────────────────
  # Sends in-game chat warnings before the daily 2am server restart
  # (runs cron inside container, triggers at 01:55 each day)
  restart-announcer:
    build: ./restart-announcer
    container_name: mc-restart-announcer
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      RCON_HOST: minecraft
      RCON_PORT: 25575
      RCON_PASSWORD: "__RCON_PASSWORD_FROM_FILE__"
      TZ: Europe/Zurich

volumes:
  mc-data:
