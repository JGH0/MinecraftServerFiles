##                          ##
##         BlueMap          ##
##     Webserver-Config     ##
##                          ##

# With this setting you can disable the integrated web-server.
# The container's nginx reverse-proxies /map/ to this webserver, so leave it enabled.
# Default is enabled
enabled: true

# The webroot that the server will host to the web.
# Must match webapp.conf!
# Default is "bluemap/web"
webroot: "bluemap/web"

# The port that the webserver listens to.
# Default is 8100
port: 8100

# Since the map is served through nginx, bind the integrated webserver to all
# interfaces inside the container (default).
# Config-section for webserver-activity logging
log: {
  # The file where all the webserver-activity will be logged to.
  # Comment out to disable the logging completely.
  file: "bluemap/web/logs/webserver.log"

  # Whether the logger should append to an existing file, or overwrite it
  # Default is false
  append: true

  # The format of the webserver-activity logs.
  format: "%1$s \"%3$s %4$s %5$s\" %6$s %7$s"
}
