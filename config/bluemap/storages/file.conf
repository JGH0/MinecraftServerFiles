##                          ##
##         BlueMap          ##
##      Storage-Config      ##
##                          ##

# The storage-type of this storage.
# Don't change this value!
storage-type: file

# The path to the folder where bluemap will save the rendered map.
# Lives under the webserver webroot so the webapp can serve it directly.
# Default is: "bluemap/web/maps"
root: "bluemap/web/maps"

# The compression-type that bluemap will use to compress generated map-data.
# Available compression-types are: gzip, zstd, deflate, none
# Default is: gzip
compression: gzip
