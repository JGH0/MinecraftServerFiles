##                          ##
##         BlueMap          ##
##    Map-Config: world     ##
##                          ##

# The overworld map. The other two dimensions live next to this file in
# world_the_nether.conf and world_the_end.conf.
world: "world"

dimension: "minecraft:overworld"

# Display-name on the webapp
name: "Overworld"

sorting: 0

# The color of the sky as a hex-color
# Default is "#7dabff"
sky-color: "#7dabff"

# The color of the void as a hex-color
# Default is "#000000"
void-color: "#000000"

# Defines the initial sky-light-strength the map will be set to when it is opened.
# Default is 1
sky-light: 1

# Defines the ambient light-strength that every block is receiving, regardless of the sunlight/blocklight.
# Default is 0
ambient-light: 0

# Hide everything below Y 55 that isn't visible from above — great for map performance.
# Set to -10000 to render all caves.
# Default is 55
remove-caves-below-y: 55

# BlueMap's cave-detection starting point relative to the ocean-floor heightmap.
# Defaults to 10000 (disabled)
cave-detection-ocean-floor: -5

# Also use block-light (additionally to sky-light) for cave-detection.
# Default is false
cave-detection-uses-block-light: false

# Render-bounds (uncomment and edit to limit the rendered area).
# Default is no min or max value (= infinite bounds)
#min-x: -4000
#max-x: 4000
#min-z: -4000
#max-z: 4000
#min-y: 50
#max-y: 320

# Only render chunks players have actually visited.
# Default is 0
min-inhabited-time: 0

# Pretend everything outside the render-bounds is AIR, so world cuts look solid.
# Default is true
render-edges: true

# View-modes (perspective / flat / free-flight).
# Default is true for all three
enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: true

# The hires-layer gives the full 3D block models when zoomed in.
# Disabling it speeds up rendering a lot but loses the 3D detail.
# Default is true
enable-hires: true

# Storage-config used for this map (see ./storages/).
# Default is "file"
storage: "file"

# Normally BlueMap omits chunks that have no light-data yet.
# Default is false
ignore-missing-light-data: false

# Static marker-sets (spawn, waystones, shops, ...).
# See https://bluemap.bluecolored.de/wiki/customization/Markers.html
marker-sets: {
}
