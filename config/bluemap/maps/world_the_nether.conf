##                          ##
##         BlueMap          ##
##  Map-Config: world_the_nether
##                          ##

# Note: point at the world ROOT (not world/DIM-1). On 1.21 the dimension
# folders have no level.dat of their own — BlueMap reads it from the root and
# picks the folder via the "dimension" key below.
world: "world"

dimension: "minecraft:the_nether"

name: "Nether"

sorting: 1

sky-color: "#330808"
void-color: "#000000"

sky-light: 0.6
ambient-light: 0.6

# The nether is a fully enclosed dimension — render everything, no cave-culling.
remove-caves-below-y: -10000
cave-detection-ocean-floor: 10000

# Ignore the bedrock ceiling so the map doesn't look flat from above.
max-y: 126

min-inhabited-time: 0
render-edges: true

enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: true

enable-hires: true

storage: "file"

ignore-missing-light-data: true

marker-sets: {
}
