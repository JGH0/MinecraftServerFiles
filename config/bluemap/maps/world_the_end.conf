##                          ##
##         BlueMap          ##
##  Map-Config: world_the_end
##                          ##

# Note: point at the world ROOT (not world/DIM1). On 1.21 the dimension
# folders have no level.dat of their own — BlueMap reads it from the root and
# picks the folder via the "dimension" key below.
world: "world"

dimension: "minecraft:the_end"

name: "The End"

sorting: 2

sky-color: "#0b0b14"
void-color: "#000000"

sky-light: 0.7
ambient-light: 0.4

remove-caves-below-y: -10000
cave-detection-ocean-floor: 10000

min-inhabited-time: 0
render-edges: true

enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: true

enable-hires: true

storage: "file"

ignore-missing-light-data: true

marker-sets: {
}
