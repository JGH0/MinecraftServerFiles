# ============================================================
# mc.hallenbarter.org — nginx config
#
# Serves the static website from /usr/share/nginx/html and
# reverse-proxies /map/ to BlueMap's integrated webserver.
#
# Both this webserver and BlueMap run inside the same
# container, so "127.0.0.1" is the Minecraft server itself.
# ============================================================

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Static site: clean URLs like /mods -> mods.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # BlueMap web-app + map-data
    location /map/ {
        proxy_pass http://127.0.0.1:8100/;
        proxy_http_version 1.1;

        # WebSocket / SSE support for live player markers
        proxy_set_header Upgrade                $http_upgrade;
        proxy_set_header Connection             "upgrade";
        proxy_set_header Host                   $host;
        proxy_set_header X-Real-IP              $remote_addr;
        proxy_set_header X-Forwarded-For        $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto      $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Downloads: world copies live in an optional host folder
    # (/usr/share/nginx/backups/downloads) and mods.zip is baked into the
    # image at /ui/downloads. try_files picks whichever exists, so mods.zip
    # always works even on a fresh clone with no backups folder.
    location /downloads/ {
        root /usr/share/nginx/backups;
        try_files $uri @baked_downloads;
        autoindex off;
    }

    location @baked_downloads {
        root /ui;                 # -> /ui/downloads/<file>
        try_files $uri =404;
    }

    # Give big world backups room and let browsers resume them
    client_max_body_size 0;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location = /404.html {
        internal;
    }
    error_page 404 /404.html;
}
